# THE HORSE RECYCLING CENTRE. This address was Amsterdam's first horse butchery, and the deep
# history belongs to the DOOR rather than to whoever is trading behind it today. See
# skills/coffeeshop/GHOSTS.md.
site_history:
  - what: "Het Zwarte Paard — G. Sinck en Zoon"
    trade: "paardenslagerij, leerlooierij, stables, horse hire and horse dealing"
    from: 1852        # Gerrit Sinck, a tanner, on the Schans by the Raampoort
    partnership: 1866 # with his son Johan Christoph Sinck (1837–1923), once Marnixstraat existed
    first_of_its_kind: "the first horse butchery in Amsterdam"
    # Don's phrase for it is exact. A worn-out horse went in the gate and came out as meat over
    # the counter, leather from the tannery, and a hoof handed back to its former owner as a
    # keepsake. Nothing left the yard unused. A recycling centre, at municipal scale: late in
    # the century the city ran on some four thousand working horses.
    price_paid: "100 guilders for 'vette, gezonde, voor den dienst onbruikbare paarden'"
    who_ate_it: "the Jordaan, from about 1860, at 12 cents a kilo when beef climbed out of reach"

  - what: "het toestel van Sinck — the horse crane"
    invented: ~1860
    by: "Johan Christoph Sinck"
    why: |
      Horses fell into the canals constantly. The first method was a rope over a canalside tree,
      which injured as often as it saved; Johan built a wheeled tripod hoist instead. Around
      fifty horses a year came out of the water on it, at ten to forty guilders a lift.
    the_dark_half: |
      He never stopped being the butcher. A horse hurt past saving was bought on the spot and
      lay on his counter the same day, and some of it went on to the lions at Artis.
    nickname: "'zinktoestel', in the mouths of Amsterdammers"
    afterlife: "sold to the city in 1917; the brandweer went on using it into the 1930s, on cars too"
    model_you_can_crank: "the Amsterdam Museum has a 15:100 working model — hoist your own horse"

# The crane's work happened all over the city, so the photograph is not filed here: a rescue on
# the Leliegracht is a different subject from the yard that built the machine. Story, image and
# sidecar live together a few blocks away.
the_cranes_work: spots/leliegracht-horse-hoist      # STORY.md, and a 1929 photograph of a crowd

