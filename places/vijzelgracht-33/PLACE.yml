  - visited: 2009-10-04
    by: don
    key_photo: PicturesOriginal/IMG_0160.JPG          # in the old Coffeeshops trunk, not vendored

from_visitor_comments:
  # Facts from 2013 site comments, our words, commenters unnamed.
  claim: "advertised itself as Amsterdam's first coffeeshop"
  pool_table: "downstairs"

# A GHOST, and the flagship one. See skills/coffeeshop/GHOSTS.md.
closed:
  date: 2017-01-01              # last trading day was Saturday 31 December 2016
  cause: afstandscriterium      # the 250-metre school-distance rule
  detail: |
    A hairdressing academy 230 metres away. Twenty-one more metres and the oldest coffeeshop in
    the city would have stayed open, and the students at the academy were mostly adults anyway.
    The owner fought it with meetings, petitions and lawsuits, and lost.
  policy_origin: |
    Not a local whim but a trade made in 2012: Amsterdam was excused from the ingezetenen-
    criterium — the wietpas that would have barred foreigners and, the mayor argued, pushed the
    business into the street — and accepted the distance rule in exchange. Eleven shops had
    already gone that way before this one, and eight closed the same weekend.
  cohort: "one of 8 closed that weekend; 11 earlier under the same rule"
  source: press-and-reference

# Its own claim, and it was widely granted: the first coffeeshop in Amsterdam, and arguably
# anywhere. The register keys on doors, so the lineage is two records, not one.
lineage:
  - address: "Weesperzijde 53"
    what: "a squatted former bakery — where it started"
    from: 1972                  # some accounts say 1973; the founders' telling is 1972
    founders: "Wernard Bruining and friends"
    called_itself: "a teahouse, after the 1920s and 30s American cannabis cafes"
    ended: 1978                 # burned down
    in_our_register: false      # no tolerated address there now, and nothing in the 2011 sheet
  - address: "Vijzelgracht 33"
    what: "the second life, under a different owner, same name and philosophy"
    ended: 2017-01-01

# WHY THIS SHOP IS IN THE MENU RULES. Mellow Yellow sold hash in plastic bags at fixed prices
# of 10 and 25 guilders. Before that it came wrapped in tin foil that sometimes turned out to
# hold rubber tyre or dog food, and every purchase was a haggle. The fixed-price bag ended
# both, and it is why this project refuses to divide a bag by its weight: the bag IS the unit,
# and it has been the unit since 1972.
invented_here: "the fixed-price bag"

survey_note: |
  We have our own photograph of it trading, from 2009-10-06, with Don's own GPS fix and camera
  bearing — eight years before the city closed it. Nobody took that picture as an act of
  preservation; it became one.

ceremony:
