# Facts extracted from the 150 visitor comments on amsterdank.nl (2009-2013).
#
# Our words, not theirs: facts travel, sentences do not, commenters are never named.
# Dates matter -- a 2010 fact and a 2013 fact are different facts. Opinions are kept only
# where the opinion IS the fact (a rule about laptops, a warning about the cat).
#
# Keyed by subject id, so these fold into places/<id>/ as those get built.
# ~20 comments from Dec 2011 are SEO spam with deliberate typos. Ignored, not recorded.

source: amsterdank-nl-2013
extracted: 2026-09-15
policy: "facts yes, expression no, identities never"

oudebrugsteeg-27:            # 420 Café
  volcano: "a Volcano vaporizer for customers"        # 2011
  laundromat: "a laundromat nearby"                   # 2011
  cat: "present"                                      # 2011, from the shop across the alley
  cat_etiquette: "act disgusted when the cat touches you and your service suffers"
  chair: "readers knew the chair etiquette well enough to joke about it"   # 2012

