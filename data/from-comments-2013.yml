patterns_across_the_corpus:
  the_pig: "a hostel referenced by three separate commenters as their base — De Kroon II
            across the street, Blues Brothers outside the door, the Bulldog a walk away.
            Useful geography: it explains which shops tourists reached first."
  menu_links: "two commenters linked coffeeshopmenus.org pages, which is how that source
               entered this project's ancestry."
  seating_matters: "the most common concrete complaint across 150 comments is nowhere to sit.
                    Worth a field. Amsterdam coffeeshops are frequently standing-room."
  spam: "~20 comments from Dec 2011 are SEO spam with deliberately misspelled flattery."
